services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: mvpfactory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - factory-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mvpfactory"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  factory-db:
